<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0e2a3d"><title>BARAMEEL RUN — Scan</title><link rel="stylesheet" href="./styles.css?v=20260928-14"><script src="./config.js?v=20260928-14"></script></head><body><main class="scan-stage"><img class="scan-art" src="./assets/screen05-scanner.webp" alt="Scan the checkpoint"><a id="back" class="scan-back-hotspot" href="screen04.html" aria-label="Back"></a><div id="cameraWindow" class="camera-window"><video id="video" playsinline webkit-playsinline muted autoplay></video><div id="flash" class="success-flash"></div></div><button id="open" class="scan-open-hotspot" aria-label="Open camera"><span class="sr-only">Open camera and scan</span></button><button id="collections" class="scan-collections-hotspot" aria-label="Direct to my collections"><span class="sr-only">Direct to my collections</span></button><canvas id="scanCanvas" hidden></canvas><div id="msg" class="scan-message"></div></main><script src="./app.js?v=20260928-14"></script><script>(function(){const video=document.getElementById('video'),cam=document.getElementById('cameraWindow'),msg=document.getElementById('msg'),canvas=document.getElementById('scanCanvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),open=document.getElementById('open'),back=document.getElementById('back'),collections=document.getElementById('collections'),flash=document.getElementById('flash');let stream=null,detector=null,raf=0,locked=false,starting=false;const status=t=>msg.textContent=t||'';function stop(){cancelAnimationFrame(raf);raf=0;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;cam.classList.remove('active');locked=false}async function native(){if(!('BarcodeDetector' in window))return false;try{const fs=await BarcodeDetector.getSupportedFormats();if(fs.includes('qr_code')){detector=new BarcodeDetector({formats:['qr_code']});return true}}catch{}return false}async function start(){if(starting||stream)return;starting=true;BR.play('scan');status('POINT CAMERA AT QR CODE');if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){status('CAMERA NEEDS HTTPS');BR.play('error');starting=false;return}try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});cam.classList.add('active');video.srcObject=stream;await video.play();starting=false;await native();if(!detector&&typeof window.jsQR!=='function'){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';s.onload=()=>loop();s.onerror=()=>{status('QR READER UNAVAILABLE');BR.play('error')};document.head.appendChild(s)}else loop()}catch(e){starting=false;status('CAMERA ACCESS DENIED OR UNAVAILABLE');BR.play('error')}}async function loop(){if(!stream||locked)return;try{if(video.readyState>=2){if(detector){const x=await detector.detect(video);if(x?.length)return handle(x[0].rawValue||'')}else if(window.jsQR){const w=640,h=Math.round(640*(video.videoHeight||480)/(video.videoWidth||640));canvas.width=w;canvas.height=h;ctx.drawImage(video,0,0,w,h);const x=window.jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});if(x?.data)return handle(x.data)}}}catch{}raf=requestAnimationFrame(loop)}async function handle(raw){if(locked)return;const q=BR.parseQR(raw);if(!q){status('INVALID BARAMEEL QR');BR.play('error');return}locked=true;stop();BR.play('scan');flash.classList.add('on');let result;if(q.type==='universal'){result=await BR.scanUniversal({qrToken:q.token,ticketId:new URLSearchParams(location.search).get('ticket')});if(!result&&!(BR.CONFIG?.production)){result=await BR.demoUniversalDraw()}}else{const fresh=BR.collect(q.collection,q.image,q.piece);const cfg=await BR.fetchCollection(q.collection);const im=cfg.images.find(x=>x.imageId===q.image);const p=im?.pieces.find(x=>Number(x.piece_number)===q.piece);const points=Number(p?.points||0);if(fresh)BR.addPoints(points);const reward={collection:q.collection,image:q.image,piece:q.piece,points,duplicate:!fresh,at:Date.now()};BR.setLastReward(reward);result={ok:true,reward,player:BR.state}}if(result?.ok&&result.reward){BR.setLastReward(result.reward);try{sessionStorage.setItem('barameelLastScan',JSON.stringify(result.reward))}catch{}await BR.track('qr_scan',{reward:result.reward,mode:q.type});setTimeout(()=>BR.go('screen06.html?collection='+(result.reward.collection||'collection01')+'&image='+(result.reward.image||'image01')),300)}else{status(result?.error||'SCAN NOT AVAILABLE — TRY AGAIN');BR.play('error');locked=false}}open.onclick=e=>{e.preventDefault();start()};collections.onclick=e=>{e.preventDefault();stop();BR.goAfter('screen06.html','confirm',180)};back.onclick=e=>{e.preventDefault();stop();BR.goAfter('screen04.html','back',220)};window.addEventListener('pagehide',stop)})();</script></body></html>
